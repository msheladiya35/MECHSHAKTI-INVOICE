services:
  - type: web
    name: mechshakti-portal
    env: python
    buildCommand: "pip install -r requirements.txt || true"
    startCommand: "python3 server.py"
    envVars:
      - key: RENDER
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.9.0"
    disk:
      name: mechshakti-data
      mountPath: /var/data
      sizeGB: 1
